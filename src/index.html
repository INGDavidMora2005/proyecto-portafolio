<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Portafolio · David Mora</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Portafolio digital de David Mora Duque, estudiante de Ingeniería de Sistemas en la UCEVA. Presentación profesional y catálogo de cinco proyectos construidos con Angular."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8eae5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1214" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      (function () {
        var root = document.documentElement;
        var theme = 'light';
        try {
          var stored = localStorage.getItem('portfolio-theme');
          var prefersDark =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          theme = stored === 'dark' || (stored !== 'light' && prefersDark) ? 'dark' : 'light';
        } catch (error) {
          theme = 'light';
        }
        root.setAttribute('data-theme', theme);
        root.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
