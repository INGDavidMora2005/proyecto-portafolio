<section class="profile" aria-labelledby="perfil-title">
  <app-section-header headingId="perfil-title" index="02" title="Perfil" [level]="1" />

  <div class="profile__top">
    <app-identity-ficha class="profile__top__ficha" [perfil]="perfil" />

    <div class="profile__top__main">
      <p class="profile__lead">{{ perfil.titular }}</p>

      <section class="profile__block" aria-labelledby="presentacion-title">
        <app-section-header headingId="presentacion-title" index="02.1" title="Presentación" />
        <div class="prose">
          @for (parrafo of perfil.presentacion; track $index) {
            <p>{{ parrafo }}</p>
          }
        </div>
      </section>
    </div>
  </div>

  <section class="profile__block" aria-labelledby="habilidades-title">
    <app-section-header
      headingId="habilidades-title"
      index="02.2"
      title="Habilidades"
      description="Tecnologías y prácticas con las que construyo y despliego aplicaciones."
    />
    <app-skills-list [grupos]="perfil.habilidades" />
  </section>

  <section class="profile__block" aria-labelledby="principios-title">
    <app-section-header headingId="principios-title" index="02.3" title="Cómo trabajo" />
    <app-principles [principios]="perfil.principios" />
  </section>

  <div class="profile__cta">
    <a class="cta-link cta-link--primary" routerLink="/proyectos">Ver proyectos</a>
    <a class="cta-link cta-link--ghost" routerLink="/contacto">Contacto</a>
  </div>
</section>
