<section class="profile" aria-labelledby="perfil-title">
  <app-section-header headingId="perfil-title" title="Perfil" [level]="1" />

  <div class="profile__body">
    <div class="profile__aside">
      <app-identity-ficha [perfil]="perfil" />
    </div>

    <div class="profile__main">
      <p class="profile__lead">{{ perfil.titular }}</p>

      <section class="profile__block" aria-labelledby="presentacion-title">
        <app-section-header headingId="presentacion-title" title="Presentación" />
        <div class="prose">
          @for (parrafo of perfil.presentacion; track $index) {
            <p>{{ parrafo }}</p>
          }
        </div>
      </section>

      <section class="profile__block" aria-labelledby="idiomas-title">
        <app-section-header headingId="idiomas-title" title="Idiomas" />
        <dl class="languages">
          @for (idioma of perfil.idiomas; track idioma.nombre) {
            <div class="language">
              <dt class="language__name">{{ idioma.nombre }}</dt>
              <dd class="language__level">{{ idioma.nivel }}</dd>
            </div>
          }
        </dl>
      </section>

      <section class="profile__block" aria-labelledby="habilidades-title">
        <app-section-header
          headingId="habilidades-title"
          title="Habilidades"
          description="Tecnologías y prácticas con las que construyo y despliego aplicaciones."
        />
        <app-skills-list [grupos]="perfil.habilidades" />
      </section>

      <section class="profile__block" aria-labelledby="principios-title">
        <app-section-header headingId="principios-title" title="Cómo trabajo" />
        <app-principles [principios]="perfil.principios" />
      </section>
    </div>
  </div>

  <div class="profile__cta">
    <a class="cta-link cta-link--primary" routerLink="/proyectos">Ver proyectos</a>
    <a class="cta-link cta-link--ghost" routerLink="/contacto">Contacto</a>
  </div>
</section>
