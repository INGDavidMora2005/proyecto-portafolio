<aside class="ficha" aria-label="Ficha de identidad">
  <div class="ficha__portrait-wrapper">
    <span class="ficha__fig" aria-hidden="true">FIG. 01</span>
    <app-portrait-frame
      class="ficha__portrait"
      [src]="'images/perfil-800.webp'"
      [alt]="'Retrato de David Mora Duque'"
      [loading]="'lazy'"
      [fetchpriority]="'low'"
      [sizes]="'(min-width: 1024px) 240px, (min-width: 640px) 200px, 88vw'"
      [objectPosition]="'50% 30%'"
    />
  </div>
  <div class="ficha__body">
    <p class="ficha__name">{{ perfil().nombre }}</p>
    <dl class="ficha__facts">
      @for (dato of perfil().datosClave; track dato.etiqueta) {
        <div class="ficha__fact">
          <dt>{{ dato.etiqueta }}</dt>
          <dd>{{ dato.valor }}</dd>
        </div>
      }
    </dl>
  </div>
</aside>
