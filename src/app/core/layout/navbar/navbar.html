<header class="site-header">
  <div class="shell site-header__inner">
    <a class="brand" routerLink="/" (click)="closeMenu()" aria-label="David Mora, ir al inicio">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__name">David Mora</span>
    </a>

    <nav
      id="menu-principal"
      class="primary-nav"
      [class.is-open]="menuOpen()"
      aria-label="Navegación principal"
    >
      <ul class="nav__list">
        @for (link of links; track link.path) {
          <li>
            <a
              class="nav__link"
              [routerLink]="link.path"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: link.path === '/' }"
              ariaCurrentWhenActive="page"
              (click)="closeMenu()"
            >
              <span class="nav__index" aria-hidden="true">{{ link.index }}</span>
              <span class="nav__label">{{ link.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="header-actions">
      <button
        class="icon-button"
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="themeAction()"
        [attr.title]="themeAction()"
      >
        @if (theme.resolved() === 'dark') {
          <svg
            aria-hidden="true"
            focusable="false"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
        } @else {
          <svg
            aria-hidden="true"
            focusable="false"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z" />
          </svg>
        }
      </button>

      <button
        #menuToggle
        class="icon-button menu-toggle"
        type="button"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
        aria-controls="menu-principal"
        (click)="toggleMenu()"
      >
        @if (menuOpen()) {
          <svg
            aria-hidden="true"
            focusable="false"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          >
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        } @else {
          <svg
            aria-hidden="true"
            focusable="false"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          >
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        }
      </button>
    </div>
  </div>
</header>
